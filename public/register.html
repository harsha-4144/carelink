<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CARELINK AI: Register patient</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">CARELINK AI</a>
  <span class="amb">Ambulance: 108</span>
  <a class="call" href="tel:112">Call 112</a>
</header>
<div id="error-banner" class="banner" role="alert" hidden></div>
<main>
  <h1>Register a patient</h1>
  <p class="tagline">Creates a CARELINK ID and a QR code that first responders can scan. Demo data only.</p>
  <form id="reg-form">
    <label for="name">Full name *</label><input id="name" type="text" required>
    <label for="phone">Phone</label><input id="phone" type="tel">
    <label for="blood_group">Blood group</label>
    <select id="blood_group"><option value="">Unknown</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
    <label for="allergies">Allergies</label><input id="allergies" type="text" placeholder="e.g. Penicillin">
    <label for="conditions">Medical conditions</label><input id="conditions" type="text">
    <label for="medications">Medications</label><input id="medications" type="text">
    <h2 style="margin-top:1rem">Guardian</h2>
    <label for="guardian_name">Guardian name *</label><input id="guardian_name" type="text" required>
    <label for="guardian_phone">Guardian phone</label><input id="guardian_phone" type="tel">
    <label for="guardian_relation">Relation</label><input id="guardian_relation" type="text">
    <h2 style="margin-top:1rem">Consent</h2>
    <label class="check"><input type="checkbox" id="consent_medical" required> I consent to storing my medical information so responders can see it in an emergency. *</label>
    <label class="check"><input type="checkbox" id="consent_guardian" required> I consent to my guardian being alerted in an emergency. *</label>
    <label class="check"><input type="checkbox" id="consent_face"> (Optional) I consent to face recognition for identification. Only used if the server has it enabled.</label>
    <div class="row"><button type="submit" id="reg-submit">Register and create QR</button></div>
  </form>
  <div id="reg-result" class="qr-card" hidden>
    <h2 id="r-name"></h2>
    <p>CARELINK ID: <strong class="big" id="r-id"></strong></p>
    <img id="r-qr" alt="QR code for this patient" width="300" height="300">
    <p class="note">Scan this at the start of an emergency, or type the ID.</p>
    <div class="row no-print" style="justify-content:center"><button id="print-btn" type="button">Print</button><a class="btn secondary" href="/">Back to emergency screen</a></div>
  </div>
</main>
<script src="/js/api.js"></script>
<script>
$('reg-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('reg-submit');
  btn.disabled = true;
  try {
    const v = (id) => $(id).value.trim();
    const r = await api('POST', '/api/patients', {
      name: v('name'), phone: v('phone'), blood_group: $('blood_group').value, allergies: v('allergies'),
      conditions: v('conditions'), medications: v('medications'),
      guardian_name: v('guardian_name'), guardian_phone: v('guardian_phone'), guardian_relation: v('guardian_relation'),
      consent: { medical: $('consent_medical').checked, guardian_alerts: $('consent_guardian').checked, face: $('consent_face').checked },
    });
    $('r-name').textContent = v('name');
    $('r-id').textContent = r.carelink_id;
    $('r-qr').src = r.qr_data_url;
    $('reg-result').hidden = false;
    $('reg-form').hidden = true;
  } catch (err) { /* banner shown */ } finally { btn.disabled = false; }
});
$('print-btn').addEventListener('click', () => window.print());
</script>
</body>
</html>
