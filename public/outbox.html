<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#dc2626">
<title>CARELINK AI: SMS log</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">CARELINK<span>AI</span></a>
  <nav id="nav" class="nav" aria-label="Account"></nav>
  <span class="amb">Ambulance: 108</span>
  <a class="call" href="tel:112">Call 112</a>
</header>
<noscript><div class="banner">CARELINK needs JavaScript. If this is an emergency, call 112.</div></noscript>
<div id="error-banner" class="banner" role="alert" hidden></div>
<main>
  <div class="page-head"><div><h1>Simulated SMS log</h1><p>Every text CARELINK would send to guardians and hospitals. Nothing leaves this server in the demo; a real SMS provider plugs in at one place.</p></div></div>
  <div id="o-list"><div class="skeleton"></div><div class="skeleton"></div></div>
</main>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
async function load() {
  try {
    const r = await api('GET', '/api/outbox', undefined, { quiet: true });
    $('o-list').innerHTML = r.messages.length ? r.messages.map((m) => '<div class="card"><b>To ' + esc(m.to_name || 'unknown') + '</b> <span class="note">' + esc(m.to_phone || '') + ' · emergency #' + esc(m.session_id) + ' · ' + esc(fmtTime(m.created_at)) + '</span><div class="sms" style="margin-top:.4rem">' + esc(m.body) + '</div></div>').join('')
      : '<div class="empty"><b>No messages yet</b>Run an emergency and the texts appear here.</div>';
    clearError();
  } catch (e) { showError(e.status === 404 ? 'The SMS log is only available in demo mode.' : e.message); }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
